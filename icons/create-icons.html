<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Create Icons</title>
</head>
<body>
  <canvas id="canvas48" width="48" height="48"></canvas>
  <canvas id="canvas64" width="64" height="64"></canvas>
  <canvas id="canvas96" width="96" height="96"></canvas>
  <canvas id="canvas128" width="128" height="128"></canvas>

  <script>
    const SIZES = [48, 64, 96, 128];

    // Mirrors icon-*.svg: drawn in a 96x96 coordinate space and scaled
    function createIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      ctx.scale(size / 96, size / 96);

      // Background
      ctx.fillStyle = '#3498db';
      ctx.roundRect(0, 0, 96, 96, 16);
      ctx.fill();

      // Text "FQ"
      ctx.fillStyle = 'white';
      ctx.font = 'bold 40px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('FQ', 44, 64);

      // Lines
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(16, 24);
      ctx.lineTo(80, 24);
      ctx.stroke();

      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(24, 36);
      ctx.lineTo(72, 36);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // Subscript "SS": red cursive with a white outline for contrast
      ctx.font = 'bold 15px "Segoe Script", cursive';
      ctx.textAlign = 'left';
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.strokeText('SS', 69, 74);
      ctx.fillStyle = '#e3170a';
      ctx.fillText('SS', 69, 74);
    }

    // RoundRect polyfill for older browsers
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        this.beginPath();
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
      };
    }

    SIZES.forEach(size => createIcon(`canvas${size}`, size));

    // Download icons
    setTimeout(() => {
      SIZES.forEach(size => {
        const canvas = document.getElementById(`canvas${size}`);
        const link = document.createElement('a');
        link.download = `icon-${size}.png`;
        link.href = canvas.toDataURL();
        link.click();
      });
    }, 100);
  </script>

  <p>Icons should download automatically. If not, right-click on the canvases above and save them.</p>
</body>
</html>
